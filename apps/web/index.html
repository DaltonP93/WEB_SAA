<!doctype html>
<html lang="es-PY">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP de respaldo: Nginx manda la cabecera real (incluye frame-ancestors,
         que en meta no aplica). Frames permitidos: el mapa y el desafío
         anti-spam. Los hosts de Turnstile/reCAPTCHA están declarados pero sólo
         se usan si el sanatorio configura CAPTCHA_PROVIDER + claves; sin eso
         el front no carga ningún script de terceros. -->
    <!-- script-src/connect-src incluyen los hosts de analítica opt-in (GA4, GTM,
         Meta Pixel). Sin un ID configurado y sin consentimiento no se carga
         ningún script que los use. Tienen que coincidir con la CSP de Nginx en
         scripts/deploy/setup-vps.sh. -->
    <!-- SIN `upgrade-insecure-requests` a propósito. Mientras el sitio se sirva
         por IP sobre http (no hay dominio ni certificado válido todavía), esa
         directiva reescribe a https TODOS los assets propios —que son rutas
         relativas— y el navegador los rechaza con ERR_CERT_COMMON_NAME_INVALID:
         la página queda en blanco. No aporta nada acá: no hay una sola
         referencia http:// en el árbol, los terceros ya son https y, cuando
         haya dominio + Let's Encrypt, los assets relativos serán https solos.
         Reintroducirla sólo tiene sentido junto con HSTS y dominio propio. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://challenges.cloudflare.com https://www.google.com https://www.gstatic.com https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://challenges.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://connect.facebook.net https://www.facebook.com; form-action 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.google.com https://google.com https://maps.google.com https://www.google.com.py https://google.com.py https://challenges.cloudflare.com" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#005587" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <title>Sanatorio Adventista de Asunción</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
